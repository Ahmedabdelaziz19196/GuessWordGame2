<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title></title>
        <link rel="stylesheet" href="guess.css" />
    </head>
    <body>
        <h1></h1>
        <div class="start-game">
            <div class="tries-inputs">
                <input type="text" placeholder="Wtite Your Tries" />
                <button class="start">START</button>
            </div>
            <div class="key-colors">
                <div class="key-color">
                    <div class="key in-place"></div>
                    <div class="key-text">Correct</div>
                </div>
                <div class="key-color">
                    <div class="key not-in-place"></div>
                    <div class="key-text">Not in place</div>
                </div>
                <div class="key-color">
                    <div class="key wrong"></div>
                    <div class="key-text">Wrong</div>
                </div>
            </div>
        </div>
        <div class="guess-game">
            <div class="game-area">
                <div class="inputs"></div>
                <div class="controls">
                    <button class="try-again">Try Again</button>
                    <button class="hint"><span></span> HINTS</button>
                </div>
                <div class="massage"></div>
            </div>
        </div>
        <footer></footer>
        <script src="main.js"></script>
    </body>
</html>
